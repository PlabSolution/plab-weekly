<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PLAB 주간업무보고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff; --surface: #ffffff; --surface-2: #f7f7f8; --surface-3: #efeff1; --hover: #f9f9fa;
    --text: #1f1f23; --text-2: #4b4b52; --muted: #7a7a82; --line: #e1e1e5; --line-2: #ececef;
    --side: #2e2238; --side-2: #3b2d47; --side-text: #ddd6e3; --side-muted: #a497b0; --side-active: #4f7ec7;
    --accent: #1d6fb8; --accent-soft: #e6f0f9; --send: #1f8a5b;
    --mention: #fff3c4; --mention-text: #8a5a00;
    --green: #1f8a5b; --green-soft: #e3f3ea; --blue: #1d6fb8; --blue-soft: #e6f0f9;
    --orange: #b56b00; --orange-soft: #fff1d6; --red: #c9363e; --red-soft: #fce9ea;
    --money: #6b4fbb; --money-soft: #f0ecfa;
    --head: #f4f3f6;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1c20; --surface: #1b1c20; --surface-2: #222328; --surface-3: #2b2c32; --hover: #212227;
      --text: #e6e6e9; --text-2: #c2c2c8; --muted: #8e8e96; --line: #34353b; --line-2: #2a2b30;
      --side: #1a1520; --side-2: #2a2232; --side-text: #d6cfdc; --side-muted: #8f8499; --side-active: #3e6db3;
      --accent: #6aa8e6; --accent-soft: #1f2b38; --send: #2a9d6a; --mention: #4a3d16; --mention-text: #f2cf6b;
      --green: #4cc38a; --green-soft: #1b3127; --blue: #6aa8e6; --blue-soft: #1f2b38;
      --orange: #e9ad52; --orange-soft: #392c18; --red: #f0767c; --red-soft: #3a2023;
      --money: #b4a0f0; --money-soft: #2a2440; --head: #24222a; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1c20; --surface: #1b1c20; --surface-2: #222328; --surface-3: #2b2c32; --hover: #212227;
    --text: #e6e6e9; --text-2: #c2c2c8; --muted: #8e8e96; --line: #34353b; --line-2: #2a2b30;
    --side: #1a1520; --side-2: #2a2232; --side-text: #d6cfdc; --side-muted: #8f8499; --side-active: #3e6db3;
    --accent: #6aa8e6; --accent-soft: #1f2b38; --send: #2a9d6a; --mention: #4a3d16; --mention-text: #f2cf6b;
    --green: #4cc38a; --green-soft: #1b3127; --blue: #6aa8e6; --blue-soft: #1f2b38;
    --orange: #e9ad52; --orange-soft: #392c18; --red: #f0767c; --red-soft: #3a2023;
    --money: #b4a0f0; --money-soft: #2a2440; --head: #24222a; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.55; overflow-x: hidden; -webkit-text-size-adjust: 100%;
    font-family: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button, select, input, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .num { font-variant-numeric: tabular-nums; }

  /* ===== Sidebar ===== */
  .side { position: fixed; top: 0; left: 0; bottom: 0; width: 248px; background: var(--side); color: var(--side-text); display: flex; flex-direction: column; z-index: 40; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,.1); }
  .logo { width: 32px; height: 32px; border-radius: 8px; background: #fff; color: #2e2238; display: grid; place-items: center; font-weight: 700; flex: none; }
  .brand b { display: block; color: #fff; font-size: 15px; line-height: 1.3; }
  .brand small { display: block; color: var(--side-muted); font-size: 11.5px; }
  .nav { flex: 1; overflow-y: auto; padding: 10px 8px 16px; scrollbar-width: thin; scrollbar-color: var(--side-2) transparent; }
  .nav-item, .team-tg, .mem { width: 100%; border: 0; background: transparent; color: var(--side-text); text-align: left; cursor: pointer; border-radius: 6px; display: flex; align-items: center; gap: 8px; }
  .nav-item { padding: 6px 10px; font-size: 14px; margin-bottom: 8px; }
  .nav-item:hover, .team-tg:hover, .mem:hover { background: var(--side-2); }
  .nav-item[aria-current="true"], .mem[aria-current="true"] { background: var(--side-active); color: #fff; font-weight: 700; }
  .team { margin-top: 4px; }
  .team-tg { padding: 5px 8px; font-size: 13.5px; font-weight: 700; }
  .team-tg .car { width: 14px; display: inline-block; text-align: center; color: var(--side-muted); font-size: 10px; transition: transform .15s; }
  .team-tg[aria-expanded="false"] .car { transform: rotate(-90deg); }
  .team-tg .cnt { margin-left: auto; font-size: 11.5px; font-weight: 400; color: var(--side-muted); }
  .team-ms { padding: 2px 0 6px; }
  .mem { padding: 5px 10px 5px 30px; font-size: 14px; }
  .mem small { color: var(--side-muted); font-size: 12px; }
  .mem[aria-current="true"] small { color: rgba(255,255,255,.75); }
  .mem .me-tag { margin-left: auto; font-size: 11px; color: var(--side-muted); }
  .mem[aria-current="true"] .me-tag { color: rgba(255,255,255,.8); }
  .sd { width: 8px; height: 8px; border-radius: 50%; flex: none; border: 1.5px solid var(--side-muted); display: inline-block; }
  .sd.submitted { background: #3cc47c; border-color: #3cc47c; }
  .sd.empty, .sd.no_tab { border-color: #e9ad52; }
  .sd.no_access, .sd.no_file, .sd.unknown { border-style: dashed; }
  .legend { padding: 8px 18px 10px; font-size: 11.5px; color: var(--side-muted); display: flex; gap: 12px; flex-wrap: wrap; border-top: 1px solid rgba(255,255,255,.08); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .me-box { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid rgba(255,255,255,.1); font-size: 13px; }
  .avatar { width: 28px; height: 28px; border-radius: 7px; background: #c58b3a; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 11px; flex: none; position: relative; }
  .avatar::after { content: ""; position: absolute; right: -3px; bottom: -3px; width: 10px; height: 10px; border-radius: 50%; background: #2fb36b; border: 2px solid var(--side); }
  .scrim { display: none; }

  /* ===== Main ===== */
  .main { margin-left: 248px; min-height: 100vh; }
  .mhd { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; padding: 10px 24px; flex-wrap: wrap; }
  .menu-btn { display: none; border: 1px solid var(--line); background: var(--surface); width: 34px; height: 34px; border-radius: 8px; cursor: pointer; font-size: 16px; }
  .weeknav { display: inline-flex; align-items: center; gap: 2px; }
  .weeknav button { border: 0; background: transparent; width: 26px; height: 26px; border-radius: 6px; cursor: pointer; font-size: 15px; color: var(--muted); }
  .weeknav button:hover:not(:disabled) { background: var(--surface-3); color: var(--text); }
  .weeknav button:disabled { opacity: .3; cursor: default; }
  .weeknav select { border: 0; background: transparent; font-weight: 700; font-size: 17px; color: var(--text); padding: 0 2px; cursor: pointer; max-width: 230px; }
  .weekrange { color: var(--muted); font-size: 13px; }
  .spacer { flex: 1; }
  .pill { font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 4px; white-space: nowrap; display: inline-block; }
  .pill.ok { background: var(--green-soft); color: var(--green); }
  .pill.warn { background: var(--orange-soft); color: var(--orange); }
  .pill.bad { background: var(--red-soft); color: var(--red); }
  .pill.n { background: var(--surface-3); color: var(--text-2); }
  .pill.cur { background: var(--accent-soft); color: var(--accent); }

  .content { padding: 18px 24px 120px; max-width: 1280px; }
  .banner { margin-bottom: 14px; padding: 8px 12px; border-radius: 8px; font-size: 13px; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--line); display: flex; gap: 6px 12px; align-items: center; flex-wrap: wrap; }
  .banner b { color: var(--text); }
  .banner select { font-size: 13px; border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; background: var(--surface); color: var(--text); }

  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--text); }
  .btn:hover { background: var(--surface-2); text-decoration: none; }
  .btn.primary { background: var(--send); border-color: var(--send); color: #fff; font-weight: 700; }
  .btn.primary:hover { background: var(--send); filter: brightness(1.08); }
  .btn.link { border: 0; background: transparent; color: var(--accent); padding: 2px 0; font-size: 12.5px; }
  .btn.link:hover { text-decoration: underline; background: transparent; }
  .btn:disabled { opacity: .55; cursor: default; }

  /* person header */
  .who { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .av { width: 40px; height: 40px; border-radius: 9px; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
  .av.c0 { background: #c0533a; } .av.c1 { background: #2f7d6d; } .av.c2 { background: #5b5fc7; } .av.c3 { background: #b07a1f; } .av.c4 { background: #a2477e; } .av.c5 { background: #3a78a8; }
  .who h2 { margin: 0; font-size: 18px; line-height: 1.3; }
  .who h2 small { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 4px; }
  .who .meta { font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 2px; }
  .who .acts { margin-left: auto; display: flex; gap: 6px; align-items: center; }

  /* ===== Report table — 시트와 같은 모양: 구분 | 지난주 과업 | 비고 | 이번주 과업 | 비고 ===== */
  .rt { display: grid; grid-template-columns: 140px minmax(0, 1.35fr) minmax(0, .8fr) minmax(0, 1.35fr) minmax(0, .8fr); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
  .rt > div { border-top: 1px solid var(--line); border-right: 1px solid var(--line-2); min-width: 0; }
  .rt > div.c-nnote, .rt > div.c-dec, .rt > .h:nth-child(5) { border-right: 0; }
  .rt > .c-lnote { border-right: 1px solid var(--line); }
  .rt > .h { border-top: 0; background: var(--head); padding: 10px 12px; font-weight: 700; font-size: 13.5px; display: flex; align-items: baseline; gap: 6px 8px; flex-wrap: wrap; }
  .rt > .h small { font-weight: 400; color: var(--muted); font-size: 12px; }
  .rt > .h .sum { margin-left: auto; font-weight: 500; font-size: 12.5px; color: var(--text-2); }
  .rt > .h.note { color: var(--text-2); font-weight: 500; }
  .rt .c-cat { background: var(--surface-2); padding: 10px 12px; position: relative; }
  .rt .c-last, .rt .c-next, .rt .c-lnote, .rt .c-nnote, .rt .c-dec { padding: 8px 10px 10px; }
  .rt .c-lnote, .rt .c-nnote { background: color-mix(in srgb, var(--surface-2) 45%, var(--surface)); }
  .cat-name { font-weight: 700; font-size: 14px; overflow-wrap: anywhere; white-space: pre-line; }
  textarea.cat-in { width: 100%; font-weight: 700; font-size: 14px; color: var(--text); background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 3px 6px; margin: -3px -6px; outline: none; resize: none; overflow: hidden; line-height: 1.45; }
  textarea.cat-in:hover { border-color: var(--line); background: var(--surface); }
  textarea.cat-in:focus { border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px var(--accent-soft); }
  .row-del { margin-top: 8px; border: 0; background: transparent; color: var(--muted); font-size: 12px; cursor: pointer; padding: 0; opacity: 0; }
  .c-cat:hover .row-del, .c-cat:focus-within .row-del { opacity: 1; }
  .row-del:hover { color: var(--red); }
  .rt .c-dec-h { background: var(--mention); color: var(--mention-text); padding: 10px 12px; font-weight: 700; }
  .rt .c-dec-h small { display: block; font-weight: 400; font-size: 11.5px; opacity: .85; margin-top: 2px; }
  .rt .c-dec { grid-column: 2 / 6; background: color-mix(in srgb, var(--mention) 28%, var(--surface)); }

  /* 여러 줄 입력칸 (시트 셀 하나 = 입력칸 하나) */
  textarea.cell { width: 100%; resize: none; overflow: hidden; font-size: 13.5px; line-height: 1.6; color: var(--text); background: transparent; border: 1px solid transparent; padding: 4px 6px; min-height: 64px; outline: none; border-radius: 6px; display: block; }
  textarea.cell:hover { border-color: var(--line-2); }
  textarea.cell:focus { background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  textarea.cell::placeholder { color: var(--muted); }
  textarea.cell.note { font-size: 13px; color: var(--text-2); min-height: 48px; }
  .tx { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13.5px; line-height: 1.6; padding: 4px 6px; }
  .tx.note { font-size: 13px; color: var(--text-2); }
  .meta-strip { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 6px; padding: 0 6px; }
  .meta-strip .lb { font-size: 11.5px; color: var(--muted); }

  /* 진행률 */
  .pg { border-radius: 12px; padding: 0 8px; font-size: 12px; font-weight: 700; line-height: 20px; white-space: nowrap; border: 1px solid transparent; }
  .pg.p100 { background: var(--green-soft); color: var(--green); }
  .pg.pmid { background: var(--blue-soft); color: var(--blue); }
  .pg.plow { background: var(--orange-soft); color: var(--orange); }
  .pg.pnone { background: var(--surface-3); color: var(--muted); font-weight: 500; }
  select.pg { appearance: none; -webkit-appearance: none; cursor: pointer; padding: 0 18px 0 8px; height: 22px;
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: right 9px top 9px, right 5px top 9px; background-size: 4px 4px; background-repeat: no-repeat; }
  select.pg:hover, select.pg:focus { border-color: currentColor; outline: none; }
  select.pg option { color: var(--text); background: var(--surface); font-weight: 400; }

  /* 비용 */
  .won { font-size: 12px; font-weight: 700; color: var(--money); background: var(--money-soft); border-radius: 4px; padding: 0 6px; line-height: 20px; white-space: nowrap; }
  .cost { width: 84px; height: 22px; border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; font-size: 12px; font-weight: 700; color: var(--money); background: var(--surface); text-align: right; outline: none; }
  .cost::placeholder { color: var(--muted); font-weight: 400; }
  .cost:focus { border-color: var(--money); box-shadow: 0 0 0 2px var(--money-soft); }
  .cost:not(:focus):not(:placeholder-shown) { background: var(--money-soft); border-color: transparent; }

  .stale { font-size: 11px; font-weight: 700; color: var(--mention-text); background: var(--mention); padding: 0 6px; border-radius: 4px; white-space: nowrap; line-height: 20px; }
  .cell-empty { color: var(--muted); font-size: 13px; padding: 4px 6px; }
  /* ■ 소제목 묶음 */
  .secs { display: flex; flex-direction: column; gap: 4px; }
  .sec-blk { border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); }
  .sec-hd { display: flex; align-items: center; gap: 6px; padding: 5px 8px; flex-wrap: wrap; min-height: 32px; }
  button.sec-tg { border: 0; background: transparent; cursor: pointer; padding: 0; display: inline-flex; align-items: center; gap: 6px; text-align: left; font-size: 13.5px; font-weight: 700; color: var(--text); flex: 1 1 140px; min-width: 0; }
  .sec-tg .chev, .sec-hd .chev { width: 16px; flex: none; color: var(--muted); transition: transform .15s; display: inline-block; text-align: center; font-size: 11px; }
  .sec-blk.open .chev { transform: rotate(90deg); }
  .sec-tg .tt { overflow-wrap: anywhere; }
  .sec-tg .cnt, .sec-hd .cnt { font-weight: 400; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .sec-body { display: none; padding: 0 8px 8px 30px; }
  .sec-blk.open .sec-body { display: block; }
  .sec-body .tx { padding: 0; }
  button.chev-btn { border: 0; background: transparent; cursor: pointer; padding: 0; display: inline-flex; color: var(--muted); }
  input.sec-title { flex: 1 1 140px; min-width: 0; font-weight: 700; font-size: 13.5px; border: 1px solid transparent; border-radius: 5px; padding: 2px 6px; background: transparent; outline: none; color: var(--text); }
  input.sec-title:hover { border-color: var(--line); }
  input.sec-title:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--surface); }
  .sec-opt { border: 1px dashed var(--line); background: transparent; color: var(--muted); border-radius: 11px; font-size: 11.5px; padding: 0 8px; line-height: 20px; cursor: pointer; white-space: nowrap; }
  .sec-opt:hover { color: var(--text-2); border-color: var(--text-2); }
  .sec-x { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 14px; padding: 0 2px; opacity: .6; }
  .sec-x:hover { color: var(--red); opacity: 1; }
  .sec-tools { display: flex; align-items: center; gap: 4px 6px; flex-wrap: wrap; padding: 0 8px 6px 30px; }
  .sec-hd .sec-del { font-size: 11.5px; }
  .sec-blk .sec-body textarea.cell { min-height: 40px; }
  .sec-add { margin-top: 2px; align-self: flex-start; border: 0; background: transparent; color: var(--accent); font-size: 12.5px; cursor: pointer; padding: 2px 6px; font-weight: 600; }
  .sec-add:hover { text-decoration: underline; }
  textarea.cell.pre { min-height: 40px; }
  .auto { font-size: 11px; color: var(--muted); }
  .table-acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .hint { font-size: 12px; color: var(--muted); }

  /* blank */
  .blank { text-align: center; padding: 56px 20px; border: 1px dashed var(--line); border-radius: 12px; background: var(--surface-2); }
  .blank .ic { font-size: 34px; }
  .blank h3 { margin: 8px 0 6px; font-size: 18px; }
  .blank p { margin: 0 0 16px; color: var(--text-2); }
  .blank code { font-size: 12.5px; background: var(--surface-3); padding: 1px 6px; border-radius: 4px; }

  /* overview */
  .ov-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
  .kpi { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; min-width: 0; }
  .kpi .l { font-size: 12.5px; color: var(--muted); }
  .kpi .v { font-size: 22px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi .v small { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 2px; }
  .kpi .s { font-size: 12.5px; color: var(--text-2); }
  .kpi.alert .v { color: var(--mention-text); }
  .kpi.money .v { color: var(--money); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .chip { font-size: 12.5px; padding: 0 6px; border-radius: 4px; background: var(--orange-soft); color: var(--orange); font-weight: 500; border: 0; cursor: pointer; }
  .chip.ok { background: var(--green-soft); color: var(--green); cursor: default; }
  .sec { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 14px; overflow: hidden; }
  .sec h3 { margin: 0; padding: 10px 14px; font-size: 14px; background: var(--head); border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
  .sec.dec h3 { background: var(--mention); color: var(--mention-text); }
  .tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .tbl th, .tbl td { padding: 9px 14px; border-top: 1px solid var(--line-2); text-align: left; vertical-align: middle; }
  .tbl thead th { border-top: 0; font-size: 12px; font-weight: 500; color: var(--muted); background: var(--surface-2); white-space: nowrap; }
  .tbl td.r, .tbl th.r { text-align: right; white-space: nowrap; }
  .tbl tr.click { cursor: pointer; }
  .tbl tr.click:hover td { background: var(--hover); }
  .bar { display: flex; align-items: center; gap: 8px; min-width: 120px; }
  .bar .tr { flex: 1; height: 8px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
  .bar .fl { height: 100%; border-radius: 4px; }
  .bar .fl.p100 { background: var(--green); } .bar .fl.pmid { background: var(--blue); } .bar .fl.plow { background: var(--orange); }

  /* 받아 둔 6명 보고서로 전체 현황 계산 (서버 getOverview와 같은 결과) — 다 있으면 서버 요청 없이 즉시 표시 */
  function overviewCalc(ms, teams, getRp) {
    var res = { total: ms.length, submitted: 0, missing: [], decisions: [], members: [], teams: [], totals: {} };
    var team = {}, all = { prog: [], lastCost: 0, nextCost: 0, decisionCost: 0 };
    function avg(a) { return a.length ? Math.round(a.reduce(function (x, y) { return x + y; }, 0) / a.length) : null; }
    ms.forEach(function (m) {
      var rp = getRp(m), r = rp.report || { rows: [], decision: null }, st = stats(r);
      var status = rp.noFile ? "no_file" : !rp.exists ? "no_tab" : hasContent(r) ? "submitted" : "empty";
      if (status === "submitted") res.submitted++; else res.missing.push(m.email);
      res.members.push({ email: m.email, status: status, progress: st.progress, lastCost: st.lastCost, nextCost: st.nextCost });
      var t = team[m.team] = team[m.team] || { team: m.team, prog: [], lastCost: 0, nextCost: 0, submitted: 0, total: 0 };
      t.prog = t.prog.concat(st.progList); t.lastCost += st.lastCost; t.nextCost += st.nextCost; t.total++; if (status === "submitted") t.submitted++;
      all.prog = all.prog.concat(st.progList); all.lastCost += st.lastCost; all.nextCost += st.nextCost;
      if (r.decision && hasText(r.decision.text)) {
        decisionLines(r.decision).forEach(function (line, i) { res.decisions.push({ email: m.email, text: line, cost: i === 0 ? +r.decision.cost || 0 : 0 }); });
        all.decisionCost += +r.decision.cost || 0;
      }
    });
    var order = teams.concat(Object.keys(team).filter(function (t) { return teams.indexOf(t) < 0; }));
    res.teams = order.filter(function (t) { return team[t]; }).map(function (t) { var x = team[t]; return { team: t, progress: avg(x.prog), lastCost: x.lastCost, nextCost: x.nextCost, submitted: x.submitted, total: x.total }; });
    res.totals = { progress: avg(all.prog), lastCost: all.lastCost, nextCost: all.nextCost, decisionCost: all.decisionCost };
    return res;
  }

  var Mock = (function () {
    var today = kstToday();
    function weekOf(day) {
      var mon = addD(day, -((wdOf(day) + 6) % 7)), thu = addD(mon, 3), y = +thu.slice(0, 4);
      var w1 = addD(y + "-01-04", -((wdOf(y + "-01-04") + 6) % 7)), w = (dn(mon) - dn(w1)) / 7 + 1;
      // 월요일 기준: 그 달 첫 월요일이 있는 주 = 1주차 (Code.gs CONFIG.WEEK_RULE='monday'와 동일)
      return { key: y + "-W" + pad(w), label: +mon.slice(5, 7) + "월 " + Math.ceil(+mon.slice(8, 10) / 7) + "주차", start: mon, end: addD(mon, 4) };
    }
    var cur = weekOf(today), WEEKS = [];
    for (var i = 0; i < 12; i++) WEEKS.push(weekOf(addD(cur.start, -7 * i)));
    // ⚠️ 공개 레포에 들어가는 미리보기 데이터 — 실존 인물·실제 업무와 무관한 가상 예시만 사용
    var TEAMS = ["경영", "기획팀", "사업팀", "영업팀", "개발팀"];
    var MEMBERS = [
      { email: "demo1@example.com", name: "홍길동", title: "대표", team: "경영" },
      { email: "demo2@example.com", name: "김철수", title: "팀장", team: "기획팀" },
      { email: "demo3@example.com", name: "이영희", title: "매니저", team: "기획팀" },
      { email: "demo4@example.com", name: "박민수", title: "팀장", team: "사업팀" },
      { email: "demo5@example.com", name: "최지은", title: "팀장", team: "영업팀" },
      { email: "demo6@example.com", name: "정다은", title: "팀장", team: "개발팀" }
    ];
    var me = MEMBERS[2];
    // 업무구분별 [지난주 과업, 이번주 과업] — 시트처럼 한 칸에 여러 줄
    var PLAN = {
      "demo1@example.com": [["경영", "분기 실적 리뷰 (예시)\n연간 계획 초안 (예시)", "분기 목표 점검 (예시)"], ["대외\n협력", "협력사 미팅 2건 (예시)", "협력사 제안 검토 (예시)"]],
      "demo2@example.com": [["운영", "월간 운영 회의 준비 (예시)", "업무 매뉴얼 정리 (예시)"], ["총무", "비품 구매 (예시)", "비품 재고 점검 (예시)"]],
      "demo3@example.com": [["사내\n시스템", "■ 주간보고 화면 개선 (예시) · 진행 100%\n· 시안 3종 비교 (예시)\n· 사이드바 레이아웃 확정 (예시)\n\n■ 대시보드 데이터 연결 (예시) · 진행 60% · 집행 ₩120,000\n· 시트 4종 연결 (예시)\n· 차트 영역 준비 (예시)\n· 권한 점검 (예시)\n\n■ 비품 구입 (예시) · 집행 ₩85,000\n· 모니터 암 (예시)\n· 노트북 거치대 (예시)", "■ 대시보드 데이터 연결 (예시) · 진행 60%\n· 차트 마무리 (예시)\n\n■ 자동화 스크립트 정리 (예시)"], ["문서", "보고서 양식 통일 (예시)", "회의록 정리 (예시)"]],
      "demo4@example.com": [["사업", "고객 인터뷰 3건 (예시)", "시장 조사 (예시)"], ["교육", "설명회 자료 준비 (예시)", "교육 일정 수립 (예시)"]],
      "demo5@example.com": [["영업", "견적서 회신 받기 (예시)\n신규 리드 연락 (예시)", "견적서 회신 받기 (예시)\n전시회 참가 신청 (예시)"], ["제안", "제안서 전달 (예시)", "제안 미팅 (예시)"]],
      "demo6@example.com": [["개발", "■ 결제 기능 연동 (예시) · 진행 70%\n· 테스트 결제 확인 (예시)\n· 환불 처리 남음 (예시)\n\n■ PDF 출력 개선 (예시) · 진행 100%\n· 글꼴 깨짐 수정 (예시)", "■ 결제 기능 연동 (예시) · 진행 70%\n· 환불 처리 (예시)"], ["품질", "테스트 케이스 확장 (예시)", "배포 점검 (예시)"]]
    };
    var PROG = { "영업": [20, 10, 0], "개발": [70, 50, 30] };   // 몇 주째 안 끝난 예시
    var DECISIONS = {
      "demo5@example.com": { text: "견적 할인 폭 승인 여부 (예시)", cost: 300000 },
      "demo6@example.com": { text: "외부 서비스 유료 플랜 전환 여부 (예시)\n테스트 서버 증설 (예시)", cost: 200000 },
      "demo4@example.com": { text: "설명회 장소 예산 승인 (예시)", cost: 200000 }
    };
    function applySec(sd) { var t = secTotals(parseSections(sd.text).secs); if (t.hasPg) sd.progress = t.progress; if (t.hasCost) sd.cost = t.cost; return sd; }
    function carryText(text) {
      return String(text || "").split("\n").map(function (ln) {
        if (!/^\s*■/.test(ln)) return ln;
        var t = ln, had = false, hit = true;
        while (hit) { hit = false; var a = SEC_PG_RE.exec(t); if (a) { t = t.slice(0, a.index); had = true; hit = true; continue; } var b = SEC_COST_RE.exec(t); if (b) { t = t.slice(0, b.index); hit = true; } }
        return t.replace(/\s+$/, "") + (had ? " · 진행 0%" : "");
      }).join("\n");
    }
    function hash(s) { var c = 0; for (var i = 0; i < s.length; i++) c = (c * 31 + s.charCodeAt(i)) % 997; return c; }
    function clone(o) { return JSON.parse(JSON.stringify(o)); }
    var STORE = {};
    MEMBERS.forEach(function (m) {
      STORE[m.email] = {};
      for (var w = 11; w >= 0; w--) {
        var rows = PLAN[m.email].map(function (g, gi) {
          var st = PROG[g[0]], p = st ? (w < st.length ? st[w] : 100) : [100, 100, 80, 50, 100, 90][hash(g[0] + w) % 6];
          var lc = hash(g[1] + w) % 4 === 0 ? 100000 + (hash(g[0]) % 5) * 50000 : 0, nc = hash(g[2] + w) % 3 === 0 ? 150000 : 0;
          return { r: 5 + gi * 3, cat: g[0],
            last: applySec({ text: w >= 2 ? g[1].replace(/진행 \d+%/g, "진행 100%") : g[1], progress: p, cost: lc, note: p < 100 && w % 2 === 0 ? "다음 주 이어서 진행 (예시)" : "" }),
            next: applySec({ text: g[2], progress: null, cost: nc, note: gi === 0 && w === 0 ? "외부 일정 확인 필요 (예시)" : "" }) };
        });
        var d = DECISIONS[m.email];
        STORE[m.email][WEEKS[w].key] = { rows: rows, decision: w <= 1 && d ? { r: 20, text: (w ? "(지난주) " : "") + d.text, cost: d.cost, note: "" } : null,
          updatedAt: addD(WEEKS[w].start, 4) + " 17:" + pad(10 + w * 3), v: 1 };
      }
    });
    delete STORE[me.email][cur.key];
    var sl = STORE["demo5@example.com"][cur.key];
    sl.rows.forEach(function (g) { g.next = { text: "", progress: null, cost: 0, note: "" }; g.last.progress = 0; g.last.cost = 0; g.last.note = ""; }); sl.decision = null; sl.updatedAt = "";

    function wi(k) { for (var i = 0; i < WEEKS.length; i++) if (WEEKS[i].key === k) return i; return -1; }
    function prevKey(k) { var i = wi(k); return i >= 0 && i + 1 < WEEKS.length ? WEEKS[i + 1].key : null; }
    function status(email, k) { var r = STORE[email][k]; return !r ? "no_tab" : hasContent(r) ? "submitted" : "empty"; }
    function openCats(r) { var o = {}; r.rows.forEach(function (g) { if (hasText(g.last.text) && g.last.progress !== null && g.last.progress < 100) o[norm(g.cat)] = true; }); return o; }
    function staleMap(email, k) {   // Code.gs staleFrom_과 같은 규칙: 업무구분별 연속 미완료 주 수
      var out = {}, r = STORE[email][k]; if (!r) return out;
      Object.keys(openCats(r)).forEach(function (c) {
        var n = 1, pk = prevKey(k);
        while (pk && STORE[email][pk] && openCats(STORE[email][pk])[c]) { n++; pk = prevKey(pk); }
        out[c] = n;
      });
      return out;
    }
    function report(email, k) {
      var m = MEMBERS.filter(function (x) { return x.email === email; })[0], w = WEEKS[wi(k)], r = STORE[email][k];
      return { member: m, access: email === me.email ? "edit" : "view", exists: !!r, noFile: false,
        tabName: w.label, fileUrl: "https://docs.google.com/spreadsheets/", prevWeek: { start: addD(w.start, -7), end: addD(w.end, -7) },
        report: r ? clone({ rows: r.rows, decision: r.decision, updatedAt: r.updatedAt }) : null, version: r ? String(r.v) : null, stale: staleMap(email, k) };
    }
    var nextR = 100;
    return {
      members: MEMBERS,
      setMe: function (e) { MEMBERS.forEach(function (m) { if (m.email === e) me = m; }); },
      getBootstrap: function () { return { me: me, weeks: WEEKS, currentWeek: cur.key, teams: TEAMS, members: MEMBERS }; },
      getWeekStatus: function (k) { var o = {}; MEMBERS.forEach(function (m) { o[m.email] = status(m.email, k); }); return { statuses: o }; },
      getReport: report,
      getInit: function () {
        var o = { boot: this.getBootstrap(), week: cur.key, statuses: {}, reports: {} };
        MEMBERS.forEach(function (m) { o.statuses[m.email] = status(m.email, cur.key); o.reports[m.email] = report(m.email, cur.key); });
        return o;
      },
      getWeek: function (k) {
        var o = { week: k, statuses: {}, reports: {} };
        MEMBERS.forEach(function (m) { o.statuses[m.email] = status(m.email, k); o.reports[m.email] = report(m.email, k); });
        return o;
      },
      createMyReport: function (k) {
        var pk = prevKey(k), prev = pk ? STORE[me.email][pk] : null;
        STORE[me.email][k] = { rows: prev ? prev.rows.map(function (g) {
            return { r: g.r, cat: g.cat, last: applySec({ text: carryText(g.next.text), progress: hasText(g.next.text) ? 0 : null, cost: 0, note: "" }), next: { text: "", progress: null, cost: 0, note: "" } }; })
          : [{ r: 5, cat: "", last: { text: "", progress: null, cost: 0, note: "" }, next: { text: "", progress: null, cost: 0, note: "" } }],
          decision: null, updatedAt: "", v: 1 };
        return report(me.email, k);
      },
      saveMyReport: function (k, r, base) {
        var cur2 = STORE[me.email][k];
        if (base != null && cur2 && String(cur2.v) !== String(base)) return { ok: false, conflict: true, message: "다른 곳에서 먼저 수정되었습니다." };
        var at = kstNow(), v = (cur2 ? cur2.v : 0) + 1;
        var rows = clone(r.rows).filter(function (g) { return norm(g.cat) !== "대표님 결정 필요"; });
        rows.forEach(function (g) { if (!g.r) g.r = nextR++; applySec(g.last); applySec(g.next); });
        var dec = r.decision && (hasText(r.decision.text) || r.decision.cost) ? clone(r.decision) : null;
        STORE[me.email][k] = { rows: rows, decision: dec, updatedAt: at, v: v };
        return { ok: true, savedAt: at, version: String(v), report: clone({ rows: rows, decision: dec, updatedAt: at }) };
      },
      getOverview: function (k) { return overviewCalc(MEMBERS, TEAMS, function (m) { return report(m.email, k); }); }
    };
  })();

  /* ---------- 시작 ---------- */
  function boot() {
    RCACHE = {};
    return call("getInit").then(function (r) {
      var b = r.boot;
      state.boot = b; state.week = r.week || b.currentWeek; state.sel = null;
      state.statuses = r.statuses || {}; cachePutReports(state.week, r.reports);
      renderWeekBar(); renderNav();
      select(b.me.email, true);
    }).catch(function (e) { $("app").innerHTML = '<div class="err">시작하지 못했습니다. ' + esc(errMsg(e)) + "</div>"; });
  }
  if (!isPreview) Auth.load();
  if (isPreview) {
    $("previewBanner").hidden = false;
    var ps = $("previewUser");
    ps.innerHTML = Mock.members.map(function (m) { return '<option value="' + m.email + '"' + (m.name === "이영희" ? " selected" : "") + ">" + m.name + " " + m.title + "</option>"; }).join("");
    ps.addEventListener("change", function () { if (!confirmLeave()) return; state.dirty = false; Mock.setMe(ps.value); boot(); });
  }
  boot();
})();
</script>
